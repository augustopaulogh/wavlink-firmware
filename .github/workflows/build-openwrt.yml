name: Build OpenWrt for Wavlink WL-WN575A4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TERM: xterm
    steps:
      - name: Checkout do repositório (inclui a pasta patch/)
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget time

      - name: Clonar OpenWrt v23.05.5
        run: |
          git clone https://github.com/openwrt/openwrt.git --branch v23.05.5 --depth 1 openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Aplicar patch WL-WN575A4
        run: |
          cp patch/mt7620a_wavlink_wl-wn575a4.dts openwrt/target/linux/ramips/dts/
          cat patch/mt7620.mk.snippet >> openwrt/target/linux/ramips/image/mt7620.mk
          # Rede: porta Ethernet única como LAN (como os outros extensores MT7620)
          sed -i 's/^\t*yukai,bocco|\\$/\twavlink,wl-wn575a4|\\\n&/' openwrt/target/linux/ramips/mt7620/base-files/etc/board.d/02_network
          grep -n -A3 'wavlink,wl-wn575a4' openwrt/target/linux/ramips/mt7620/base-files/etc/board.d/02_network

      - name: Configurar (.config) e verificar o perfil
        run: |
          cd openwrt
          cat > .config <<'CFG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_wavlink_wl-wn575a4=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CFG
          sed -i 's/^[ \t]*//' .config
          make defconfig
          # Falha logo se o perfil não foi reconhecido (em vez de compilar 1h para nada)
          grep -q '^CONFIG_TARGET_ramips_mt7620_DEVICE_wavlink_wl-wn575a4=y' .config \
            || { echo "ERRO: perfil wl-wn575a4 não reconhecido"; exit 1; }
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config

      - name: Compilar
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Listar imagens geradas
        run: ls -la openwrt/bin/targets/ramips/mt7620/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wavlink-wl-wn575a4
          path: |
            openwrt/bin/targets/ramips/mt7620/*wl-wn575a4*
            openwrt/bin/targets/ramips/mt7620/sha256sums
